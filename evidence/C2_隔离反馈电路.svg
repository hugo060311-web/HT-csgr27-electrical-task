<text x="45" y="959.07" font-family="Times New Roman" font-size="29" font-weight="normal" fill="#18232e">RLED is placed before the external contact to limit current in both field wires. D2 protects LED reversal.</text>
<text x="45" y="1019.07" font-family="Times New Roman" font-size="29" font-weight="normal" fill="#18232e">True end-to-end galvanic isolation requires the two grounds to remain unbonded elsewhere.</text>
<text x="45" y="1073.24" font-family="Times New Roman" font-size="28" font-weight="normal" fill="#18232e">J1.5 unused. Connector cavity numbering is defined in the pinout table, not by drawing left-to-right order.</text>
